  {% for f in row.fields %}

      {{ f.title }}
      <small class="text-muted">
        ({% if f.size == "short" %}คำตอบสั้น{% elif f.size == "paragraph" %}ข้อความยาว{% elif f.size == "paragraphimage" %}ข้อความยาว+รูป{% else %}{{ f.size }}{% endif %})
      </small>
    </li>
  {% endfor %}
</ol>
